<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV Token Manager</title>
<style>
body{font-family:Arial,sans-serif;max-width:750px;margin:20px auto;padding:15px;background:#f2f4f7;color:#222}
h1{font-size:25px}
textarea,input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:8px;font-size:16px}
textarea,input{border:1px solid #bbb;background:white}
textarea{height:190px}
button{border:0;background:#1769e0;color:white;font-weight:bold}
.note{background:#fff3cd;padding:12px;border-radius:8px;font-size:14px}
</style>
</head>
<body>
<h1>📺 IPTV Token Manager</h1>
<p>Добави имената и адресите на каналите, за да създадеш M3U плейлист.</p>

<label>Име на плейлиста</label>
<input id="playlistName" value="My IPTV Playlist">

<label>Канали — по един на ред</label>
<p>Формат: Име на канала | URL адрес</p>
<textarea id="channels" placeholder="Канал 1 | https://example.com/stream.m3u8
Канал 2 | https://example.com/stream2.m3u8"></textarea>

<button onclick="generate()">⬇️ Изтегли M3U плейлист</button>
<button onclick="clearForm()" style="background:#555">Изчисти полетата</button>

<div class="note">
Адресите се обработват локално в браузъра. Не публикувай плейлист с лични или временни токени в публично хранилище.
Тази страница не може сама да подновява изтичащи токени.
</div>

<script>
function generate(){
 const name=document.getElementById('playlistName').value.trim()||'IPTV Playlist';
 const lines=document.getElementById('channels').value.split(/\r?\n/);
 let output='#EXTM3U\n';
 let count=0;
 for(const line of lines){
  const pos=line.indexOf('|');
  if(pos<0) continue;
  const channel=line.slice(0,pos).trim();
  const url=line.slice(pos+1).trim();
  if(!channel||!url) continue;
  if(!/^https?:\/\//i.test(url)) continue;
  output+='#EXTINF:-1,'+channel.replace(/[\r\n]/g,'')+'\n'+url+'\n';
  count++;
 }
 if(!count){alert('Добави поне един канал във формат Име | URL');return;}
 const blob=new Blob([output],{type:'audio/x-mpegurl;charset=utf-8'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=name.replace(/[^a-z0-9а-яё_-]/gi,'_')+'.m3u';
 document.body.appendChild(a);
 a.click();
 a.remove();
 URL.revokeObjectURL(a.href);
 alert('Готово! Създадени са '+count+' канала.');
}
function clearForm(){
 if(confirm('Да изчистя ли всички въведени данни?')){
  document.getElementById('channels').value='';
 }
}
</script>
</body>
</html>
